
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="player">
        <header class="topbar">
            <div class="brand">
                <span class="brand-icon">♫</span>
                <span>NEON<span class="cyan">WAVE</span></span>
            </div>
            <span class="status"><i></i> MUSIC SYSTEM</span>
        </header>

        <section class="now-playing">
            <div class="cover" id="cover">
                <div class="cover-ring"></div>
                <div class="cover-disc">♫</div>
                <span class="cover-label">NEON SOUND</span>
            </div>

            <p class="eyebrow">NOW PLAYING</p>
            <h1 id="song-title">Select Your Music</h1>
            <p id="song-artist">Your personal music space</p>

            <audio id="audio"></audio>

            <div class="progress-section">
                <span id="current-time">0:00</span>
                <input type="range" id="progress" min="0" max="100" value="0"
                    aria-label="Song progress">
                <span id="duration">0:00</span>
            </div>

            <div class="controls">
                <button id="shuffle" class="icon-btn" title="Shuffle"
                    aria-label="Shuffle">⤨</button>
                <button id="previous" class="icon-btn" title="Previous"
                    aria-label="Previous song">|◀</button>
                <button id="play" class="play-btn" title="Play"
                    aria-label="Play">▶</button>
                <button id="next" class="icon-btn" title="Next"
                    aria-label="Next song">▶|</button>
                <button id="repeat" class="icon-btn" title="Repeat"
                    aria-label="Repeat">↻</button>
            </div>

            <div class="volume-section">
                <span>VOL</span>
                <span>◖</span>
                <input type="range" id="volume" min="0" max="1"
                    step="0.01" value="0.7" aria-label="Volume">
                <span id="volume-value">70%</span>
            </div>
        </section>

        <section class="playlist-section">
            <div class="playlist-heading">
                <div>
                    <h2>Your Playlist</h2>
                    <p id="track-count">0 tracks</p>
                </div>
                <label for="file-input" class="add-btn">＋ ADD MUSIC</label>
                <input type="file" id="file-input"
                    accept="audio/*" multiple hidden>
            </div>

            <div id="playlist" class="playlist">
                <div class="empty-state">
                    <span>♫</span>
                    <p>Your playlist is empty</p>
                    <small>Add your favorite songs to get started.</small>
                </div>
            </div>
        </section>

        <footer>
            <span>PERSONAL AUDIO PLAYER</span>
            <span>POWERED BY <b>NEON</b></span>
        </footer>
    </main>

    <script src="script.js"></script>
</body>
</html>
